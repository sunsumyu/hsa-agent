name: Audit Agent Quality Gate & Regression Eval

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pydantic fastapi loguru httpx langsmith langchain-core starlette

      - name: Run Matt Pocock Deep Module Contract Tests
        run: |
          pytest tests/unit/core/test_observability_service_deep_red.py \
                 tests/unit/api/test_chat_feedback_endpoint_red.py \
                 tests/unit/core/test_evaluation_service_deep_red.py \
                 tests/unit/core/test_prompt_service_deep_red.py -v

      - name: Execute Offline Golden Cases Quality Gate
        run: |
          python scripts/run_ci_eval.py --mode local --dataset tests/eval/golden_dataset.json --threshold 0.90
