# ============================================================
# Schema Registry — 数据库结构单一事实源
# ============================================================
# 所有模块 (security, prompts, audit_rules, tools, agent_graph)
# 都必须从此处读取表名/字段信息, 严禁硬编码。
# ============================================================

db_engine: clickhouse
main_table: fqz_gz_jzsj_all_ql
drug_catalog_table: fqz_drug_mcs_info_list
hospital_stats_table: fqz_all_yy_yd_1

# ── [V2.0] 场景-表映射规则 (Scene-Table Mapping) ───────────────
# 根据用户查询关键词自动选择正确的物理表
scene_table_mapping:
  - scenes: ["乡镇卫生院", "村卫生室", "门诊统筹", "批量刷单", "连续刷卡", "门诊费用", "牙", "拔牙", "口腔", "理疗", "康复", "卫生室", "卫生院", "门诊明细", "药品", "用药", "妇科", "专属", "耗材", "明细", "处方", "避孕", "节育", "上环", "冲正", "退费", "大额", "离群", "流水", "偏高", "超额"]
    table: "fqz_fymx_test"
    reason: "门诊与费用明细表，包含真实中文机构名、药品名(hilist_name)、项目金额(det_item_fee_sumamt)及性别(gend)。注意若用户未明确限定年份，切勿擅自追加2024过滤。"

  - scenes: ["住院", "药店购药", "分解住院", "出院", "入院", "重叠住院", "压床", "住院天数", "药店", "定点药店", "就诊结算", "统筹基金", "对账", "反复结算", "拆单", "分解就诊"]
    table: "fqz_gz_jzsj_all_ql"
    reason: "结算主记录表，包含住院/药店汇总数据。fixmedins_name 是加密字段。"

  - scenes: ["定点医疗机构", "定点零售药店", "医药机构", "医院名录", "药店名录", "二级医院", "三级医院", "定点医药机构", "纳管"]
    table: "fqz_all_yy_yd"
    reason: "全市定点医疗机构与定点零售药店名录库，包含 medins_type, medinslv 等统计维度。"

  - scenes: ["行政区划", "区划字典", "层级划分", "国家级", "省级", "地市级", "区县级", "admdvs"]
    table: "fqz_admdvs"
    reason: "全国医保行政区划四级穿透字典库，包含 admdvs_lv (0=国家, 1=省级, 2=市级, 3=区县级)。"

  - scenes: ["目录库", "药品目录", "临床药品", "头孢", "哌拉西林", "抗感染", "抗生素品种", "收载"]
    table: "fqz_drug_mcs_info_list"
    reason: "国家医保药品/诊疗目录限制信息库。"

  - scenes: ["fqz_cgzhan_hosp_fee", "宏观费用", "月度费用", "机构费用统计", "医院费用统计", "医疗总费用金额", "月度明细", "宏观资金"]
    table: "fqz_cgzhan_hosp_fee"
    reason: "定点医药机构宏观费用统计表，包含各定点机构月度医疗总费用(sum_medfee_sumamt)、统筹基金(sum_hifp_pay)及总记录数。"


# ── [V178.10] 表间关联图谱 (Table Relation Graph) ─────────────────────
# 当主表被激活时，自动拉入关联的字典表/辅助表
table_relation_graph:
  fqz_gz_jzsj_all_ql:
    auto_pull:
      - table: "fqz_admdvs_dict"
        pull_keywords: ["地区", "距离", "跨市", "行政区划", "admdvs", "空间"]
        hint: "行政区划编码字典，用于判断跨市就医"
      - table: "fqz_fixmedins_dict"
        pull_keywords: ["医院", "机构", "科室", "fixmedins"]
        hint: "医疗机构字典，包含机构名称、级别等信息"
    fields_to_inject:
      - "admdvs"
      - "fixmedins_code"
      - "fixmedins_name"

  fqz_fymx_test:
    auto_pull:
      - table: "fqz_hilist_dict"
        pull_keywords: ["药品", "耗材", "诊疗项目", "hilist", "目录"]
        hint: "药品/诊疗项目目录字典"
    fields_to_inject:
      - "hilist_code"
      - "hilist_name"

# SQLGuardian 白名单
valid_table_prefixes:
  - "fqz_"

# 幻觉表拦截列表
forbidden_table_names:
  - patient_info
  - medical_fees
  - users
  - orders
  - settlements
  - disease_policy
  - patient_records

# 脱敏字段
sensitive_fields:
  - tel
  - phone
  - mobile
  - certno
  - addr
  - psn_name

# SQL 执行安全限制
max_execution_time: 30
max_memory_usage: "2000000000"
default_limit: 100
default_time_filter: "setl_time >= '2024-01-01'"

# ── 表定义 ──────────────────────────────────────────────────

tables:
  - name: fqz_gz_jzsj_all_ql
    alias: 全量结算明细表
    description: 全量就诊结算明细, 包含参保人基本信息、诊断、费用、结算等全量字段
    partition_field: setl_time
    default_time_filter: "setl_time >= '2024-01-01 00:00:00'"
    fields:
      - { name: psn_no,           type: String,   desc: "参保人唯一ID" }
      - { name: psn_name,         type: String,   desc: "参保人姓名 (敏感)" }
      - { name: gend,             type: String,   desc: "性别编码 (1=男, 2=女)" }
      - { name: certno,           type: String,   desc: "身份证号 (敏感)" }
      - { name: tel,              type: String,   desc: "联系电话 (敏感)" }
      - { name: fixmedins_code,   type: String,   desc: "医疗机构编码" }
      - { name: fixmedins_name,   type: String,   desc: "医疗机构名称" }
      - { name: med_type,         type: String,   desc: "医疗类型 (住院/门诊/药店)" }
      - { name: setl_id,          type: String,   desc: "结算ID" }
      - { name: setl_time,        type: DateTime, desc: "结算时间" }
      - { name: start_date,       type: String,   desc: "入院/开始日期" }
      - { name: end_date,         type: String,   desc: "出院/结束日期" }
      - { name: ipt_days,         type: String,   desc: "住院天数 (String, 需 toUInt32OrZero)" }
      - { name: dise_name,        type: String,   desc: "诊断名称" }
      - { name: medfee_sumamt,    type: Float64,  desc: "医疗总费用" }
      - { name: fund_pay_sumamt,  type: Float64,  desc: "基金支付总额" }
      - { name: adm_dept_code,    type: String,   desc: "入院科室编码" }
      - { name: adm_dept_name,    type: String,   desc: "入院科室名称" }
      - { name: dscg_dept_name,   type: String,   desc: "出院科室名称" }
      - { name: inhosp_stas,      type: String,   desc: "在院状态" }
      - { name: hifp_pay,         type: Float64,  desc: "统筹基金支付" }
      - { name: acct_pay,         type: Float64,  desc: "个人账户支付" }
      - { name: cash_payamt,      type: Float64,  desc: "现金支付金额" }
      - { name: admdvs_name,      type: String,   desc: "行政区划名称" }
      - { name: chfpdr_code,      type: String,   desc: "主管医师国临代码 / 医生唯一编码" }
      - { name: chfpdr_name,      type: String,   desc: "主管医师姓名" }

  - name: fqz_drug_mcs_info_list
    alias: 医保限制目录
    description: 国家医保药品/诊疗目录限制信息
    fields:
      - { name: med_list_code,          type: String, desc: "目录编码" }
      - { name: nat_hi_druglist_memo,   type: String, desc: "国家目录限制备注 (含性别限制等)" }

  - name: fqz_all_yy_yd_1
    alias: 机构月度指标表
    description: 定点医疗机构月度统计指标
    partition_field: setl_time
    fields:
      - { name: fixmedins_code,   type: String,   desc: "医疗机构编码" }
      - { name: fixmedins_name,   type: String,   desc: "医疗机构名称" }
      - { name: medfee_sumamt,    type: Float64,  desc: "医疗总费用" }
      - { name: fund_pay_sumamt,  type: Float64,  desc: "基金支付总额" }
      - { name: vix,              type: Float64,  desc: "变异指数" }
      - { name: psn_no,           type: String,   desc: "参保人ID" }
      - { name: ipt_days,         type: String,   desc: "住院天数" }
      - { name: setl_time,        type: DateTime, desc: "结算时间" }

  - name: fqz_fymx_test
    alias: 费用明细表
    description: 就诊费用明细，包含具体的药品、耗材、诊疗项目编码及名称。⚠️ setl_time 是 String 且尾部带 \t，必须用 toDateTime(substring(trim(setl_time),1,19)) 转换。该表与 fqz_gz_jzsj_all_ql 的 setl_id 完全不重叠，严禁两表 JOIN。
    critical_notes:
      - "setl_time 是 String 类型且尾部带 \\t，必须用 toDateTime(substring(trim(setl_time),1,19)) 转换，严禁直接 toDateTime(setl_time)"
      - "med_type 是数字编码：11=门诊统筹，21=住院，53_04=特病门诊，严禁用中文过滤"
      - "该表自身自带 gend (性别代码: 1=男, 2=女) 与 age (年龄)，核查性别/年龄冲突无需关联就诊表"
      - "⚠️【关键陷阱】gend 尾部带有 \\t 制表符（即 '1\\t'），ClickHouse 的 trim() 仅去空格无法去除 \\t！因此必须使用 gend LIKE '1%' 或 replace(gend, '\\t', '') = '1'，严禁使用 trim(gend) = '1'！"
      - "该表与 fqz_gz_jzsj_all_ql 的 setl_id 完全不重叠，严禁两表 JOIN"
      - "fixmedins_name 是真实中文机构名，可 LIKE 匹配（与主表的加密混淆字段不同）"
    partition_field: setl_time
    fields:
      - { name: setl_id,              type: String,   desc: "结算ID (与主表完全不重叠，严禁跨表 JOIN)" }
      - { name: gend,                 type: String,   desc: "参保人性别 (1=男, 2=女, 尾部有\\t制表符，必须使用 gend LIKE '1%' 或 replace(gend, '\\t', '') = '1' 进行过滤)" }
      - { name: age,                  type: Int64,    desc: "参保人年龄" }
      - { name: psn_no,               type: String,   desc: "参保人唯一ID" }
      - { name: psn_name,             type: String,   desc: "参保人姓名 (脱敏)" }
      - { name: hilist_code,          type: String,   desc: "医保目录编码" }
      - { name: hilist_name,          type: String,   desc: "医保目录名称/药品名" }
      - { name: cnt,                  type: Float64,  desc: "数量" }
      - { name: pric,                 type: Float64,  desc: "单价" }
      - { name: det_item_fee_sumamt,  type: Float64,  desc: "明细费用总额" }
      - { name: fixmedins_code,       type: String,   desc: "医疗机构编码" }
      - { name: fixmedins_name,       type: String,   desc: "医疗机构名称 (真实中文，可 LIKE 匹配)" }
      - { name: insutype,             type: String,   desc: "险种类型编码 (310=职工基本医疗保险, 390=城乡居民基本医疗保险)" }
      - { name: med_type,             type: String,   desc: "医疗类型编码 (11=门诊统筹, 21=住院, 53_04=特病门诊)" }
      - { name: fee_ocur_time,        type: String,   desc: "费用发生时间 (String)" }
      - { name: setl_time,            type: String,   desc: "结算时间 (String, 尾部带 \\t, 必须用 toDateTime(substring(trim(setl_time),1,19)) 转换)" }

  - name: fqz_all_yy_yd
    alias: 定点医药机构名录表
    description: 全市定点医疗机构与定点零售药店信息库
    fields:
      - { name: fixmedins_code,       type: String,   desc: "定点医药机构编号" }
      - { name: fixmedins_name,       type: String,   desc: "定点医药机构名称" }
      - { name: admdvs,               type: String,   desc: "行政区划代码" }
      - { name: medins_type,          type: String,   desc: "机构类型 (医院/门诊部/药店等)" }
      - { name: medinslv,             type: String,   desc: "医院级别 (1=一级, 2=二级, 3=三级)" }
      - { name: hosp_lv,              type: String,   desc: "医院等级 (甲等/乙等)" }
      - { name: addr,                 type: String,   desc: "机构地址" }
      - { name: uscc,                 type: String,   desc: "统一社会信用代码" }
      - { name: vali_flag,            type: String,   desc: "有效标志" }

  - name: fqz_admdvs
    alias: 医保行政区划表
    description: 全国医保行政区划四级穿透字典库
    fields:
      - { name: admdvs,               type: String,   desc: "行政区划代码" }
      - { name: admdvs_name,          type: String,   desc: "行政区划名称" }
      - { name: prnt_admdvs,          type: String,   desc: "上级行政区划代码" }
      - { name: admdvs_lv,            type: String,   desc: "行政区划级别 (0=国家, 1=省级, 2=市级, 3=区县级)" }

  - name: fqz_drug_mcs_info_list
    alias: 国家标准药品名录库
    description: 国家医保药品目录与重点监控药品分类信息库
    fields:
      - { name: med_list_code,         type: String,   desc: "国家医保药品代码" }
      - { name: drug_genname,          type: String,   desc: "药品通用名 (如头孢类、哌拉西林等)" }
      - { name: reg_name,              type: String,   desc: "药品注册商品名 (真实药品名称)" }
      - { name: drugstdcode,           type: String,   desc: "国家药品本位码" }
      - { name: drug_dosform,          type: String,   desc: "剂型" }
      - { name: drug_type,             type: String,   desc: "药品分类 (西药/中成药)" }
      - { name: spec,                  type: String,   desc: "规格" }
      - { name: prodentp_name,         type: String,   desc: "生产企业名称" }
      - { name: nat_hi_druglist_memo,  type: String,   desc: "医保目录限制用药备注" }
      - { name: vali_flag,             type: String,   desc: "有效标志" }

  - name: fqz_cgzhan_hosp_fee
    alias: 定点医药机构费用宏观月报统计表
    description: 定点医药机构宏观费用统计表，包含月度医疗总费用与基金支付汇总
    fields:
      - { name: timetype,              type: String,   desc: "时间统计维度 (monthly/quarterly/halfyearly/yearly)" }
      - { name: fixmedins_code,        type: String,   desc: "定点医药机构编号" }
      - { name: fixmedins_name,        type: String,   desc: "定点医药机构名称" }
      - { name: med_chrgitm_type,      type: String,   desc: "医疗收费项目类型" }
      - { name: setl_time,             type: String,   desc: "结算统计月份/时间 (YYYY-MM)" }
      - { name: medinslv,              type: String,   desc: "机构级别 (1=一级, 2=二级, 3=三级)" }
      - { name: hosp_natu_code,        type: String,   desc: "医院性质编码 (1=公立, 2=民营)" }
      - { name: fix_blng_admdvs,       type: String,   desc: "机构归属医保区划" }
      - { name: fix_blng_admdvs_city,  type: String,   desc: "机构归属地市" }
      - { name: sum_medfee_sumamt,     type: Float64,  desc: "医疗总费用发生金额合计 (元)" }
      - { name: sum_hifp_pay,          type: Float64,  desc: "统筹基金支出合计 (元)" }
      - { name: sum_fund_pay_sumamt,   type: Float64,  desc: "医保基金支付总额合计 (元)" }
      - { name: sum_acct_pay,          type: Float64,  desc: "个人账户支出合计 (元)" }
      - { name: sum_cash_payamt,       type: Float64,  desc: "现金支付合计 (元)" }
      - { name: sum_item_sumamt,       type: Float64,  desc: "项目费用合计" }
      - { name: sum_item_claa_amt,     type: Float64,  desc: "甲类项目费用合计" }
      - { name: sum_item_clab_amt,     type: Float64,  desc: "乙类项目费用合计" }
      - { name: sum_item_ownpay_amt,   type: Float64,  desc: "自费项目费用合计" }
      - { name: sum_item_oth_amt,      type: Float64,  desc: "其他费用合计" }
      - { name: pct_item_sumamt,       type: Float64,  desc: "项目费用占比" }
      - { name: etl_create_time,       type: Date,     desc: "ETL抽取创建时间" }

