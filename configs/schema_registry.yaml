# ============================================================
# Schema Registry — 数据库结构单一事实源
# ============================================================
# 所有模块 (security, prompts, audit_rules, tools, agent_graph)
# 都必须从此处读取表名/字段信息, 严禁硬编码。
# ============================================================

db_engine: clickhouse
main_table: fqz_gz_jzsj_all_ql
drug_catalog_table: fqz_drug_mcs_info_list
hospital_stats_table: fqz_all_yy_yd_1

# ── [V2.0] 场景-表映射规则 (Scene-Table Mapping) ───────────────
# 根据用户查询关键词自动选择正确的物理表
scene_table_mapping:
  - scenes: ["乡镇卫生院", "村卫生室", "门诊统筹", "批量刷单", "连续刷卡", "QA-CUST-26", "门诊费用", "牙", "拔牙", "口腔", "理疗", "康复", "卫生室", "卫生院", "门诊明细"]
    table: "fqz_fymx_test"
    reason: "门诊费用明细表，包含真实中文机构名、药品名及 med_type 数字编码。setl_time 是 String 类型需转换。"

  - scenes: ["住院", "药店购药", "分解住院", "出院", "入院", "重叠住院", "压床", "住院天数", "药店", "定点药店"]
    table: "fqz_gz_jzsj_all_ql"
    reason: "结算主记录表，包含住院/药店汇总数据。fixmedins_name 是加密字段。"

# SQLGuardian 白名单
valid_table_prefixes:
  - "fqz_"

# 幻觉表拦截列表
forbidden_table_names:
  - patient_info
  - medical_fees
  - users
  - orders
  - settlements
  - disease_policy
  - patient_records

# 脱敏字段
sensitive_fields:
  - tel
  - phone
  - mobile
  - certno
  - addr
  - psn_name

# SQL 执行安全限制
max_execution_time: 30
max_memory_usage: "2000000000"
default_limit: 100
default_time_filter: "setl_time >= '2024-01-01'"

# ── 表定义 ──────────────────────────────────────────────────

tables:
  - name: fqz_gz_jzsj_all_ql
    alias: 全量结算明细表
    description: 全量就诊结算明细, 包含参保人基本信息、诊断、费用、结算等全量字段
    partition_field: setl_time
    default_time_filter: "setl_time >= '2024-01-01 00:00:00'"
    fields:
      - { name: psn_no,           type: String,   desc: "参保人唯一ID" }
      - { name: psn_name,         type: String,   desc: "参保人姓名 (敏感)" }
      - { name: gend,             type: String,   desc: "性别编码 (1=男, 2=女)" }
      - { name: certno,           type: String,   desc: "身份证号 (敏感)" }
      - { name: tel,              type: String,   desc: "联系电话 (敏感)" }
      - { name: fixmedins_code,   type: String,   desc: "医疗机构编码" }
      - { name: fixmedins_name,   type: String,   desc: "医疗机构名称" }
      - { name: med_type,         type: String,   desc: "医疗类型 (住院/门诊/药店)" }
      - { name: setl_id,          type: String,   desc: "结算ID" }
      - { name: setl_time,        type: DateTime, desc: "结算时间" }
      - { name: start_date,       type: String,   desc: "入院/开始日期" }
      - { name: end_date,         type: String,   desc: "出院/结束日期" }
      - { name: ipt_days,         type: String,   desc: "住院天数 (String, 需 toUInt32OrZero)" }
      - { name: dise_name,        type: String,   desc: "诊断名称" }
      - { name: medfee_sumamt,    type: Float64,  desc: "医疗总费用" }
      - { name: fund_pay_sumamt,  type: Float64,  desc: "基金支付总额" }
      - { name: adm_dept_code,    type: String,   desc: "入院科室编码" }
      - { name: adm_dept_name,    type: String,   desc: "入院科室名称" }
      - { name: dscg_dept_name,   type: String,   desc: "出院科室名称" }
      - { name: inhosp_stas,      type: String,   desc: "在院状态" }
      - { name: hifp_pay,         type: Float64,  desc: "统筹基金支付" }
      - { name: acct_pay,         type: Float64,  desc: "个人账户支付" }
      - { name: cash_payamt,      type: Float64,  desc: "现金支付金额" }
      - { name: admdvs_name,      type: String,   desc: "行政区划名称" }
      - { name: chfpdr_code,      type: String,   desc: "主管医师国临代码 / 医生唯一编码" }
      - { name: chfpdr_name,      type: String,   desc: "主管医师姓名" }

  - name: fqz_drug_mcs_info_list
    alias: 医保限制目录
    description: 国家医保药品/诊疗目录限制信息
    fields:
      - { name: med_list_code,          type: String, desc: "目录编码" }
      - { name: nat_hi_druglist_memo,   type: String, desc: "国家目录限制备注 (含性别限制等)" }

  - name: fqz_all_yy_yd_1
    alias: 机构月度指标表
    description: 定点医疗机构月度统计指标
    partition_field: setl_time
    fields:
      - { name: fixmedins_code,   type: String,   desc: "医疗机构编码" }
      - { name: fixmedins_name,   type: String,   desc: "医疗机构名称" }
      - { name: medfee_sumamt,    type: Float64,  desc: "医疗总费用" }
      - { name: fund_pay_sumamt,  type: Float64,  desc: "基金支付总额" }
      - { name: vix,              type: Float64,  desc: "变异指数" }
      - { name: psn_no,           type: String,   desc: "参保人ID" }
      - { name: ipt_days,         type: String,   desc: "住院天数" }
      - { name: setl_time,        type: DateTime, desc: "结算时间" }

  - name: fqz_fymx_test
    alias: 费用明细表
    description: 就诊费用明细，包含具体的药品、耗材、诊疗项目编码及名称。⚠️ setl_time 是 String 且尾部带 \t，必须用 toDateTime(substring(trim(setl_time),1,19)) 转换。该表与 fqz_gz_jzsj_all_ql 的 setl_id 完全不重叠，严禁两表 JOIN。
    critical_notes:
      - "setl_time 是 String 类型且尾部带 \\t，必须用 toDateTime(substring(trim(setl_time),1,19)) 转换，严禁直接 toDateTime(setl_time)"
      - "med_type 是数字编码：11=门诊统筹，21=住院，53_04=特病门诊，严禁用中文过滤"
      - "该表与 fqz_gz_jzsj_all_ql 的 setl_id 完全不重叠，严禁两表 JOIN"
      - "fixmedins_name 是真实中文机构名，可 LIKE 匹配（与主表的加密混淆字段不同）"
    partition_field: setl_time
    fields:
      - { name: setl_id,              type: String,   desc: "结算ID (与主表完全不重叠，严禁跨表 JOIN)" }
      - { name: hilist_code,          type: String,   desc: "医保目录编码" }
      - { name: hilist_name,          type: String,   desc: "医保目录名称/药品名" }
      - { name: cnt,                  type: Float64,  desc: "数量" }
      - { name: pric,                 type: Float64,  desc: "单价" }
      - { name: det_item_fee_sumamt,  type: Float64,  desc: "明细费用总额" }
      - { name: psn_no,               type: String,   desc: "参保人唯一ID" }
      - { name: fixmedins_code,       type: String,   desc: "医疗机构编码" }
      - { name: fixmedins_name,       type: String,   desc: "医疗机构名称 (真实中文，可 LIKE 匹配)" }
      - { name: med_type,             type: String,   desc: "医疗类型编码 (11=门诊统筹, 21=住院, 53_04=特病门诊)" }
      - { name: fee_ocur_time,        type: String,   desc: "费用发生时间 (String)" }
      - { name: setl_time,            type: String,   desc: "结算时间 (String, 尾部带 \\t, 必须用 toDateTime(substring(trim(setl_time),1,19)) 转换)" }
      - { name: chfpdr_name,          type: String,   desc: "医生姓名" }
      - { name: dise_name,            type: String,   desc: "诊断名称" }
