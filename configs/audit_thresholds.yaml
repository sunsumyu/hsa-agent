# ============================================================
# Audit Thresholds Configuration
# ============================================================
# 集中管理所有审计相关的参数配置，避免硬编码
# 此文件为单一事实源 (Single Source of Truth)
# ============================================================

# ── 风险等级阈值 (Risk Level Thresholds) ──────────────────────
# 用于报告渲染时的风险级别判断
risk_levels:
  high:
    min_amount: 50000      # 高风险：总金额 >= 50,000 CNY
    min_count: 10          # 高风险：发现条数 >= 10
  medium:
    min_amount: 10000      # 中风险：总金额 >= 10,000 CNY
    min_count: 3           # 中风险：发现条数 >= 3
  # 低于 medium 阈值则为"低"风险

# ── 统计学参数 (Statistical Parameters) ──────────────────────
statistics:
  # 异常检测默认阈值（分位数）
  anomaly_detection_default_threshold: 0.95

  # SQL 扫描容差
  sql_row_tolerance: 1000        # SQL 结果集容差（触发警告的阈值）
  sql_safety_limit: 500          # SQL 安全默认 LIMIT
  default_limit: 100             # 默认结果限制

  # 业务审核阈值
  hitl_risk_threshold: 0.6       # HITL（人机协同）风险评分阈值，触发人工审批

# ── 审计算法默认参数 (Audit Algorithm Defaults) ──────────────
algorithm_defaults:
  anomaly:
    default_threshold: 0.95
    default_limit: 100
    default_days: 3
    default_table: "fqz_gz_jzsj_all_ql"

  sliding_window:
    fraud_detection_days: 30     # 30天滑动窗口用于欺诈检测

# ── SQL 模板默认参数 (SQL Template Defaults) ────────────────
sql_templates:
  default_limit: 50
  default_time_filter: "setl_time >= '2024-01-01'"

  # 业务规则容差配置
  tolerances:
    gender_conflict: 50000
    high_freq_drug_purchase: 1000
    cross_store_high_spend: 1000
    decomposition_hospitalization: 1000
    cross_hospital_overlap: 1000
    repeat_billing: 50000
    contact_sharing: 1000
    service_without_consumable: 1000

  # 业务规则阈值
  business_thresholds:
    high_freq_drug_purchase:
      monthly_count: 10          # 高频购药：月度 >10 次
    cross_store_high_spend:
      store_count: 5             # 跨店高消费：机构数 >= 5
      fund_payment: 5000         # 跨店高消费：基金支付 > 5,000 CNY
    decomposition_hospitalization:
      readmission_window_days: 15  # 分解住院：同机构 15 天内再入院
    contact_sharing:
      visit_count: 3             # 共享联系方式：就诊次数 > 3
    repeat_billing:
      distinct_setl_count: 1     # 重复收费：不同结算ID数 > 1
    batch_billing:
      patient_count: 5           # 批量开药： distinct patients >= 5
      time_span_sec: 300         # 批量开药：时间跨度 <= 300 秒（5分钟）
      limit: 50                    # 批量开药：结果限制

# ── 敏感字段配置 (Sensitive Fields) ───────────────────────────
sensitive_fields:
  - psn_name
  - certno
  - phone
  - addr
  - org_name
  - fixmedins_name
  - id_card
  - tel

# ── 展示配置 (Display Configuration) ───────────────────────────
display:
  max_evidence_rows: 10          # 报告中最多展示的证据行数
  default_confidence: 92         # 默认报告置信度（百分比）

# ── 安全限制 (Security Limits) ────────────────────────────────
security:
  max_execution_time: 30         # SQL 最大执行时间（秒）
  max_memory_usage: 2000000000   # 最大内存使用（字节）
  default_limit: 500             # 安全默认 LIMIT

# ── Agent 配置 (Agent Configuration) ──────────────────────────
agent:
  max_retries: 3                 # Agent 自愈最大重试次数
  recursion_limit: 50            # LangGraph 最大递归步数
  default_temperature: 0.3       # LLM 默认温度

# ── 异常检测阈值 (Anomaly Detection Thresholds) ───────────────
anomaly_detection:
  # 值一致性检测：如果所有行某列值相同且超过此阈值，则视为异常
  # 但年份范围 1900-2100 除外
  consistency_threshold: 10
  year_range_min: 1900
  year_range_max: 2100

# ── 媒体重要性阈值 (Memory Importance Thresholds) ─────────────
memory:
  default_importance: 0.5
  consolidation_threshold: 0.7     # 记忆 Consolidation 阈值
  semantic_search_threshold: 0.85  # 语义缓存匹配阈值

# ── 快速路由置信度 (Fast Router Confidence) ───────────────────
routing:
  unknown_route_confidence: 0.0
  fuzzy_match_confidence_min: 0.7
  fuzzy_match_confidence_max: 0.95
  exact_match_confidence: 1.0

# ── 额度限制因子 (Quota Throttling Factors) ───────────────────
quota:
  low_remaining_ratio: 0.2     # 剩余额度 < 20% 时应用低因子
  critical_remaining_ratio: 0.05  # 剩余额度 < 5% 时应用临界因子
  low_quota_factor: 0.3
  critical_quota_factor: 0.05

# ── 专家知识阈值 (Expert Knowledge Thresholds) ────────────────
expert_knowledge:
  dental:
    normal_teeth_min: 28
    normal_teeth_max: 32
    violation_threshold: 38      # 超过 38 颗牙视为违规（+20%）
  sensitivity_analysis:
    lax_expansion_percent: 20    # 宽松 tier：阈值扩展 +20%
    very_lax_expansion_percent: 50  # 非常宽松 tier：阈值扩展 +50%
  decomposition_hospitalization:
    readmission_window_days: 15
  high_freq_drug_purchase:
    monthly_threshold: 10
    cross_pharmacy: true         # 跨多药店购药视为异常

# ── 感知分析阈值 (Sensitivity Analysis Thresholds) ─────────────
sensitivity_analysis:
  strict tier: 100               # 严格 tier：使用原始阈值
  lax_percent: 20                # 宽松 tier：阈值降低 20%
  very_lax_percent: 50           # 非常宽松 tier：阈值降低 50%

# ── 时间边界默认值 (Time Boundary Defaults) ────────────────────
# 当无法从数据中提取边界时使用的回退值
time_boundaries:
  total_records: 2138354
  min_time: "2024-03-01"
  max_time: "2024-05-09"
