# ============================================================
# Expert Knowledge Base — 医保审计专家知识库
# ============================================================
# 从主题索引返回针对性提示, 替代原硬编码字符串。
# 新增主题只需添加 topic 条目, 无需修改 Python 代码。
# ============================================================

topics:
  - title: 跨机构重复住院
    keywords: ["重复住院", "跨院", "同时住院", "重叠住院", "cross_hospital"]
    hint: >
      同一患者同一天在不同医疗机构存在重叠住院时间，通常涉及违规套取基金。
      建议核查 start_date 和 end_date 的交集 (A.start <= B.end AND B.start <= A.end)，
      并关联 medfee_sumamt 计算违规金额。
      政策依据：必须引用《医疗保障基金使用监督管理条例》第十五条第一款，以及《国家医疗保障局关于印发DRG/DIP支付方式改革三年行动计划的通知》（医保发〔2021〕48号）第十二条。

  - title: 分解住院
    keywords: ["分解住院", "短期再入院", "再入院", "decomposition"]
    hint: >
      "分解住院"指医疗机构将一次完整住院拆分为多次结算的违规行为。
      判定要点：同一患者出院后 15 天内在同一机构再次入院，
      且诊断关联度高 (dise_name 相似或 ICD 编码相同)。
      政策依据：必须引用《国家医疗保障局关于印发DRG/DIP支付方式改革三年行动计划的通知》（医保发〔2021〕48号）第十二条（关于严防“分解住院”、“挂床住院”等规避支付额度行为的禁止性规定）。

  - title: 高频购药
    keywords: ["高频购药", "频繁购药", "药店", "high_freq_drug"]
    hint: >
      参保人在药店异常高频购药 (月度 >10 次 或 跨多家药店)，
      可能涉及套现倒卖。建议按 psn_no 聚合 fixmedins_code，
      并对比 nat_hi_druglist_memo 中的剂量限制。
      政策依据：必须引用《医疗保障基金使用监督管理条例》第十九条第一款（关于参保人员不得利用其参保凭证套取基金的行政处罚基准），以及《定点零售药店服务协议管理办法》有关进销存管理规范。

  - title: 性别诊断冲突
    keywords: ["性别冲突", "性别不符", "男性妇科", "女性男科", "gender_conflict"]
    hint: >
      利用国家医保目录的 nat_hi_druglist_memo 字段进行性别限制对撞。
      例：gend='1' (男性) 不应出现 nat_hi_druglist_memo LIKE '%限女性%' 的诊疗项目。
      政策依据：必须引用《国家基本医疗保险诊疗项目范围》及《国家基本医疗保险、工伤保险和生育保险药品目录》中关于特定性别限制的报销规定，以及《医疗保障基金使用监督管理条例》第十五条第一款关于严禁套用项目、串换项目及虚构医疗服务的规定。

  - title: 重复收费
    keywords: ["重复收费", "重复结算", "重复计费", "repeat_billing"]
    hint: >
      同一就诊 (psn_no + setl_id) 下相同诊疗项目的实收数量超过单日临床合理限额。
      建议按 (psn_no, setl_id, hilist_code) 分组计数，HAVING count() > 阈值。
      政策依据：必须引用《医疗保障基金使用监督管理条例》第十五条第一款（关于严禁重复收费、超标准收费、分解项目收费的规定）。

  - title: 团伙骗保
    keywords: ["团伙", "欺诈环", "共用手机", "共用联系方式", "fraud_ring"]
    hint: >
      团伙特征：多个看似无关的参保人共享联系方式或地址。
      建议联邦查询：图谱 (Neo4j) 发现共用关系 → sideload IDs → 在 ClickHouse 汇总报销金额。
      政策依据：必须引用《中华人民共和国刑法》第二百六十六条关于以欺诈手段套取社会保险基金构成医保诈骗罪的刑事司法解释，以及《医疗保障基金使用监督管理条例》第十九条第一款关于严禁使用他人参保凭证（多卡借用/家庭套保）套取基金的规定。

  - title: 理疗科康复科时间重叠分析
    keywords: ["理疗", "康复", "手法治疗", "大夫", "分身", "重叠", "time_overlap", "therapist"]
    hint: >
      核查理疗大夫“分身术”或多人时间重叠项目。
      分析方法：理疗项目通常为一对一手法治疗，若同一大夫在同一时间（或微观时间重叠）为多位患者服务，存在虚假理疗嫌疑。
      建议按 (psn_no, setl_id, hilist_code) 关联费用明细，使用窗口函数 (ROW_NUMBER, LAG, LEAD) 针对医生和分钟级时间排序，
      筛选相同执行大夫在相邻就诊记录中发生重合的违规记录。如果执行无异常发现，零发现报告必须包含扫描时间范围、总患者数、ICD-10（如M50-M54颈椎病/腰椎病）、以及3阶敏感度分析并配上Mermaid大夫排班时序图。
      政策依据：必须引用《医疗保障基金使用监督管理条例》第十五条第一款，以及《医疗机构手术分级管理办法》（国卫医发〔2022〕18号）第十四条（关于手法治疗一日最高频次限制与同时间段执业冲突判定标准），及《国家医疗保障局关于印发DRG/DIP支付方式改革三年行动计划的通知》（医保发〔2021〕48号）第十二条（关于临床服务规范的规定）。

  - title: 伴生高值耗材缺失分析
    keywords: ["耗材", "血透", "骨科", "透析器", "钛钉", "钛板", "脊柱内固定", "service_without_consumable"]
    hint: >
      医疗服务与高值耗材的强制伴生逻辑互斥检测。例如收了血液透析治疗费但无透析器/管路，或收了脊柱内固定术手术费但无钛钉钛板等。
      分析方法：利用 A.setl_id = B.setl_id 关联结算表与费用明细表。筛选 med_type='住院' 或 诊疗明细 hilist_name 包含 '血液透析'/'脊柱内固定'。
      注意：当核查多种高值耗材缺失的复合场景时，必须使用场景隔离判定条件，在 HAVING 中针对不同场景分开计算耗材数，形如 `((A场景) AND countIf(A耗材)=0) OR ((B场景) AND countIf(B耗材)=0)`，绝对不能混合在一个 countIf 中判断，否则会因不同医疗场景的耗材存在而造成漏报。
      政策依据：必须引用《医疗保障基金使用监督管理条例》第十五条第一款，以及《第一批单病种质量管理控制指标的通知》（国卫医发〔2022〕18号）第五条（关于外科手术/血透与耗材临床伴生一致性稽核规范），及《国家医疗保障局关于印发DRG/DIP支付方式改革三年行动计划的通知》（医保发〔2021〕48号）第十二条（关于项目串换与耗材配对监管的规定）。

  - title: 跨周期重复拔牙生物极限分析
    keywords: ["拔牙", "牙齿", "根管", "口腔科", "生物极限", "impossible_dental"]
    hint: >
      参保人在两三年内跨诊所累计拔牙超量（正常人只有28-32颗牙，超过此数量或同一牙位重复拔除是严重的违规骗保）。
      分析方法：精确限制 ICD-10 代码范围为口腔科（K00-K14）。按 psn_no 聚合，统计明细中拔牙/根管治疗项目（如 '拔牙'、'根管治疗'）的累计数量
      或关联牙位编码（如 FDI 牙位）进行重排。筛选总数 > 32 颗，或者同一参保人在不同结算中出现同一颗牙（如 FDI #36）多次被拔除的异常。
      零发现报告必须包含 scanned_patients、扫描时间范围、ICD-10 (K00-K14) 清单，以及 3 档敏感度（例如将拔牙次数铺设阈值从32分别放宽到38.4和48时的扫描结果），并绘制 FDI 牙位图。
      政策依据：必须引用《口腔种植类医疗服务价格项目规范》（医保发〔2023〕21号）第三条，以及《牙体牙髓病学诊疗指南》（国卫办医发〔2022〕18号）第四条第三款，及《医疗保障基金使用监督管理条例》第十五条第一款关于严禁虚构医疗服务的规定。

  - title: 乡镇卫生院秒级批量刷单分析
    keywords: ["卫生院", "村卫生室", "秒级", "批量结算", "刷单", "时间戳", "time_series_anomaly"]
    hint: >
      乡镇卫生院或村卫生室深夜或特定时段集中批量刷卡套现。
      分析方法：按 fixmedins_code, toDate(setl_time), setl_time 精确排序。使用窗口函数 LAG(setl_time, 1) OVER (PARTITION BY fixmedins_code ORDER BY setl_time)
      计算相邻参保人结算的时间差（秒数）。筛选连续十几个不同病号，其费用明细项目完全一致，且结算时间差在 3-5 秒之内的极端异常记录。
      政策依据：必须引用《医疗保障基金使用监督管理条例》第十九条第一款（关于严禁代刷套现、空刷医保卡），以及《国家医疗保障局关于印发DRG/DIP支付方式改革三年行动计划的通知》（医保发〔2021〕48号）第十二条（关于加强基层定点医疗机构高频刷卡监管的规定）。
