[pytest]
# ==========================================================
# Argus evaluation suites
# ==========================================================
# Default: only runs `basic` (5 cases, LLM-as-judge, highest cost).
# Other suites require explicit opt-in:
#   pytest -m fuzzy
#   pytest -m refusal
#   pytest -m rules
#   pytest -m "basic or fuzzy or refusal or rules"
# ==========================================================

asyncio_mode = auto

markers =
    basic: 5 cases, patient behavior analysis, LLM-as-judge (highest token cost)
    fuzzy: 5 cases, fuzzy-intent routing (keyword + SQL-template assertions, no LLM)
    refusal: 5 cases, injection / forbidden-table / sensitive-field rejection (regex, ~zero LLM)
    rules: 5 cases, direct SQL template activation (rule-engine routing)
    user_perspective: 12 cases, brand-new end-to-end user-perspective audit scenarios
    unit: fast unit tests (no LLM, no network)

# Default addopts: run unmarked unit tests + basic eval suite with stdout streaming (-s).
# To run all suites: pytest -m "basic or fuzzy or refusal or rules or user_perspective" -o "addopts="
addopts = --capture=sys -m "not fuzzy and not refusal and not rules and not user_perspective" --strict-markers

testpaths = tests
cache_dir = tmp/.pytest_cache
