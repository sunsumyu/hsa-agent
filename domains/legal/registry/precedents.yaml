- case_id: "SPC-GUIDE-72"
  case_name: "最高人民法院指导案例第72号：汤长龙诉周士海民间借贷纠纷案"
  court: "最高人民法院审判委员会"
  case_number: "（2015）民提字第142号"
  cause_of_action: "民间借贷纠纷"
  keywords: ["转账凭证", "合伙投资", "借贷合意", "举证责任", "原因关系"]
  key_facts: "原告仅依据银行转账凭证提起民间借贷诉讼，被告抗辩该款项实为双方共同出资合作项目的合伙款项，并提供了项目合作意向与聊天备忘。"
  referee_summary: "原告仅依据金融机构的转账凭证提起民间借贷诉讼，被告抗辩转账系偿还双方之前借款或其他债务的，被告应当对其抗辩提供证据证明。被告提供相应证据证明其主张后，原告仍应就借贷关系的成立承担举证责任。"
  application_rule: "【举证责任分配规则】原告仅出示转账回单时，若被告提出实质性抗辩（如合伙、货款抵销），被告需对基础法律关系负初步反证责任；一旦被告反证达到合理怀疑程度，举证责任重新回归原告，由原告举证证明借款合意（借据/借款合同）。"

- case_id: "SPC-GUIDE-131"
  case_name: "最高人民法院指导案例第131号：高额利息与服务费穿透审查典型案例"
  court: "最高人民法院第二巡回法庭"
  case_number: "（2019）最高法民终881号"
  cause_of_action: "民间借贷纠纷"
  keywords: ["高利贷", "LPR", "服务费", "利息上限", "砍头息"]
  key_facts: "出借人约定借款年利率15%，但同时约定另行收取每月2%的咨询费、管理费及违约金，折算年化综合资金成本达39%。"
  referee_summary: "出借人以咨询费、服务费、中介费、违约金等名义收取的费用，实质上属于借款利息或变相提高借款成本的，人民法院应当穿透名实综合计算实际综合借款利率；超出合同成立时一年期LPR四倍的部分，人民法院一律不予支持。"
  application_rule: "【穿透式金融利息审判】名实不符的各类前置费用及违约金一律计入实际借贷成本，严格受民间借贷司法解释第25/29条关于4倍LPR法定上限约束，逾额部分刚性判决无效。"

- case_id: "SPC-GUIDE-142"
  case_name: "最高人民法院指导案例第142号：刘超诉甲商贸公司买卖合同纠纷案"
  court: "最高人民法院审判委员会"
  case_number: "（2020）最高法民申3129号"
  cause_of_action: "买卖合同纠纷"
  keywords: ["送货单", "签收", "表见代理", "货款", "验收"]
  key_facts: "卖方送货后由买方施工现场项目管理人员王某在《送货签收单》上签字并加盖项目部资料章，买方后主张王某无权代表公司签收，拒绝承认送货事实。"
  referee_summary: "在建设工程及买卖合同履行过程中，处于特定施工或仓储现场的经办人员在送货单、对账单上签字，其外观足以使相对人信赖其具有代理权的，构成职务代理或表见代理，其签收法律后果直接归属于买受人。"
  application_rule: "【送货单签收表见代理效力】供货方出具有现场仓管或项目人员签字盖章的送货签收单，结合运输流水，即完成交付举证责任；买方仅以经办人无授权委托书抗辩的，法院不予采纳。"

- case_id: "SPC-GUIDE-112"
  case_name: "最高人民法院指导案例第112号：违约金过高调减与实际损失举证规则案"
  court: "最高人民法院审判委员会"
  case_number: "（2018）最高法民再210号"
  cause_of_action: "买卖合同纠纷"
  keywords: ["违约金", "过分高于损失", "合同无效", "日万分之五", "禁反言"]
  key_facts: "合同约定逾期付款按日万分之五计付违约金（年化18.25%），买受人主张违约金过高请求法院依法调减；同时卖方兼具主张解除与违约金。"
  referee_summary: "约定的违约金超过造成损失的百分之三十的，一般可以认定为民法典第五百八十五条第二款规定的'过分高于造成的损失'。当事人主张约定的违约金过高的，人民法院应当以实际损失为基础，兼顾合同的履行情况、当事人的过错程度以及预期利益等综合衡量，并根据公平原则和诚信原则予以调减。"
  application_rule: "【违约金司法酌减规则】当事人主张违约金过高请求调整时，主张方须证明守约方实际损失，法院可参照同期LPR标准加计30%-50%进行合理酌减；若原告主张合同自始无效，则违约金条款无独立适用余地。"

- case_id: "SPC-GUIDE-103"
  case_name: "最高人民法院指导案例第103号：某建筑工程公司与某置业公司施工合同纠纷案"
  court: "最高人民法院审判委员会"
  case_number: "（2018）最高法民申4421号"
  cause_of_action: "建设工程施工合同纠纷"
  keywords: ["实际施工人", "相对性突破", "挂靠", "转包", "发包人欠付"]
  key_facts: "王某挂靠具备资质的建工总包承建商业楼盘，涉案工程五方联合竣工验收合格已交付使用。总包拖欠工程款，王某突破合同相对性直接起诉发包人海蓝置业承担付款责任。"
  referee_summary: "实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理；实际施工人以发包人为被告主张权利的，人民法院应当追加转包人或者违法分包人为本案当事人。发包人只在欠付转包人或者违法分包人工程价款范围内对实际施工人承担责任。"
  application_rule: "【实际施工人突破相对性二要件】1. 涉案建设工程经五方竣工验收合格；2. 发包人对总承包人负有到期未付工程款。实际施工人对发包人的欠付数额负举证责任，若通过结算单或司法审定查明发包人尚欠款项，发包人必须在欠付限额内直接向实际施工人承担给付清偿责任。"

- case_id: "SPC-GUIDE-182"
  case_name: "最高人民法院指导案例第182号：李某某诉某科技有限公司劳动争议纠纷案"
  court: "最高人民法院审判委员会"
  case_number: "（2021）最高法民申1088号"
  cause_of_action: "劳动争议纠纷"
  keywords: ["未签劳动合同", "二倍工资", "违法解除", "工会通知", "2N赔偿金"]
  key_facts: "劳动者入职近1年公司未签订书面劳动合同，后用人单位未提前30日通知且未征求工会意见，直接单方踢出工作群解除劳动合同。"
  referee_summary: "用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付二倍的工资，最长支持十一个月。用人单位单方解除劳动合同，应当事先将理由通知工会；未建立工会的，应当通过职工代表等法定形式听取意见。用人单位违反法律规定解除劳动合同的，应当向劳动者支付赔偿金（2N）。"
  application_rule: "【事实劳动关系推定与违法辞退双重保护】以银行代发薪资摘要、打卡考勤记录直接确认事实劳动关系；未签书面合同二倍工资差额自第2个月起算（最长11个月）；未履行工会前置程序且无合法过错理由的单方辞退，依法属于违法解除劳动合同，应当按照工作年限双倍（2N）支付经济赔偿金。"


- case_id: "SPC-GUIDE-24"
  case_name: "最高人民法院指导案例第24号：荣宝英诉王阳、永诚财产保险股份有限公司机动车交通事故责任纠纷案"
  court: "最高人民法院审判委员会"
  case_number: "（2013）民申字第192号"
  cause_of_action: "机动车交通事故责任纠纷"
  keywords: ["交强险", "交通事故", "先行赔付", "责任比例", "医疗费分项", "伤残赔偿金"]
  key_facts: "机动车与行人发生碰撞致行人伤残，交警认定机动车驾驶人负事故主责（70%），行人负次责（30%）。机动车投保了交强险和100万元商业三者险。"
  referee_summary: "机动车发生交通事故造成人身伤亡、财产损失的，由保险公司在机动车第三者责任强制保险责任限额范围内先行予以赔偿；超过交强险责任限额部分，由承保商业三者险的保险公司根据保险合同予以赔偿；仍有不足的，依照侵权责任法相关规定由侵权人承担赔偿责任。"
  application_rule: "【交强险无过错先行赔付规则】发生交通事故后，无论受害人是否存在次要过错，交强险责任限额内（医疗费用1.8万、伤残死亡18万、财产2千）由保险公司全额先行足额赔付，不按过错比例打折；仅在扣除交强险后的超出部分，方可按照交警认定的主次责任比例（如7:3或8:2）由商业险及侵权人分担。"

- case_id: "SPC-GUIDE-19"
  case_name: "最高人民法院指导案例第19号：赵春明等诉焦作市交通运输局等机动车交通事故纠纷案"
  court: "最高人民法院审判委员会"
  case_number: "（2012）民申字第893号"
  cause_of_action: "机动车交通事故责任纠纷"
  keywords: ["挂靠经营", "连带责任", "运输公司", "实际车主", "运行利益"]
  key_facts: "实际车主将货车挂靠在具备危险品/道路货物运输资质的运输公司名下运营并缴纳管理费。发生严重交通事故致人损害，运输公司辩称仅为名义被挂靠方不承担责任。"
  referee_summary: "以挂靠形式从事道路运输经营活动的机动车发生交通事故造成损害，属于该机动车一方责任的，由挂靠人和被挂靠人承担连带责任。"
  application_rule: "【挂靠车辆连带责任规则】原告在追偿交通事故人身损害赔偿时，有权将肇事实际车主与名义被挂靠运输公司列为共同被告；被挂靠单位收取管理费享受运行利益的，对外刚性承担连带清偿责任，不可抗辩免责。"

- case_id: "SPC-GUIDE-185"
  case_name: "最高人民法院公报案例：承租人提前退租违约金司法调整与空置期合理损失案"
  court: "最高人民法院审判委员会"
  case_number: "（2021）最高法民申2341号"
  cause_of_action: "房屋租赁合同纠纷"
  keywords: ["提前退租", "押金没收", "违约金酌减", "合理空置期", "再出租义务"]
  key_facts: "商户租赁商铺签订3年期合同，承租1年后因经营不善提前退租并腾空交房，房东主张没收全部2个月押金并另行索赔剩余2年全部未付租金及高额违约金。"
  referee_summary: "承租人提前退租构成违约，出租人有权解除合同并请求赔偿损失。但出租人在合同解除后负有防止损失扩大的减损义务，应及时寻找新租客。违约金兼具惩罚与补偿性质，以出租人实际遭受的房屋合理空置期损失（通常以1至3个月租金为限）为基准衡量，约定的违约金及未到期租金过分高于实际损失的，人民法院应当依法予以调减。"
  application_rule: "【提前退租违约金酌减与防损原则】承租人提前解约的，出租人无权主张剩余租期的全部租金；若押金已足以覆盖房屋合理空置期（1-3个月）及水电物业欠费，法院对出租人额外主张的巨额违约金应予剔除或调减至实际空置损失额以内。"
